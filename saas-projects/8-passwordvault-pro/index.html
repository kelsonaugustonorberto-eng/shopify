<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PasswordVault Pro - Gerenciador de Senhas</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app">
        <header>
            <h1>🔐 PasswordVault Pro</h1>
            <button class="btn" id="lockBtn">🔒 Bloquear</button>
        </header>
        <div id="loginScreen" class="login-screen">
            <h2>Digite sua Senha Mestra</h2>
            <input type="password" id="masterPassword" placeholder="Senha mestra...">
            <button class="btn" id="unlockBtn">Desbloquear</button>
        </div>
        <div id="vaultScreen" class="vault-screen" style="display:none">
            <div class="generator">
                <h2>Gerador de Senhas</h2>
                <input type="text" id="generatedPassword" readonly>
                <div class="gen-controls">
                    <label><input type="number" id="passLength" value="16" min="8" max="64"> caracteres</label>
                    <label><input type="checkbox" id="useUppercase" checked> Maiúsculas</label>
                    <label><input type="checkbox" id="useLowercase" checked> Minúsculas</label>
                    <label><input type="checkbox" id="useNumbers" checked> Números</label>
                    <label><input type="checkbox" id="useSymbols" checked> Símbolos</label>
                </div>
                <button class="btn" id="generateBtn">🎲 Gerar Senha</button>
            </div>
            <div class="add-password">
                <h2>Adicionar Nova Senha</h2>
                <input type="text" id="site" placeholder="Site/Serviço">
                <input type="text" id="username" placeholder="Usuário/Email">
                <input type="text" id="password" placeholder="Senha">
                <button class="btn" id="addBtn">➕ Adicionar</button>
            </div>
            <div class="password-list">
                <h2>Suas Senhas</h2>
                <div id="passwordsList"></div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
