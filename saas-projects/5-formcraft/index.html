<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FormCraft - Construtor de Formulários Profissionais</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <h1 class="logo">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/>
                        <polyline points="14 2 14 8 20 8"/>
                        <line x1="16" y1="13" x2="8" y2="13"/>
                        <line x1="16" y1="17" x2="8" y2="17"/>
                        <polyline points="10 9 9 9 8 9"/>
                    </svg>
                    FormCraft
                </h1>
                <div class="header-actions">
                    <button class="btn btn-secondary" id="clearFormBtn">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="3 6 5 6 21 6"/>
                            <path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/>
                        </svg>
                        Limpar
                    </button>
                    <button class="btn btn-primary" id="exportCodeBtn">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="16 18 22 12 16 6"/>
                            <polyline points="8 6 2 12 8 18"/>
                        </svg>
                        Exportar HTML
                    </button>
                </div>
            </div>
        </header>

        <div class="main-content">
            <!-- Toolbar -->
            <div class="toolbar">
                <div class="toolbar-section">
                    <h3>Campos do Formulário</h3>
                    <div class="field-types">
                        <button class="field-btn" data-type="text">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <line x1="17" y1="10" x2="3" y2="10"/>
                                <line x1="21" y1="6" x2="3" y2="6"/>
                                <line x1="21" y1="14" x2="3" y2="14"/>
                                <line x1="17" y1="18" x2="3" y2="18"/>
                            </svg>
                            Texto
                        </button>
                        <button class="field-btn" data-type="email">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                                <polyline points="22,6 12,13 2,6"/>
                            </svg>
                            Email
                        </button>
                        <button class="field-btn" data-type="tel">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72 12.84 12.84 0 00.7 2.81 2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45 12.84 12.84 0 002.81.7A2 2 0 0122 16.92z"/>
                            </svg>
                            Telefone
                        </button>
                        <button class="field-btn" data-type="number">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <line x1="4" y1="9" x2="20" y2="9"/>
                                <line x1="4" y1="15" x2="20" y2="15"/>
                                <line x1="10" y1="3" x2="8" y2="21"/>
                                <line x1="16" y1="3" x2="14" y2="21"/>
                            </svg>
                            Número
                        </button>
                        <button class="field-btn" data-type="textarea">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/>
                            </svg>
                            Texto Longo
                        </button>
                        <button class="field-btn" data-type="select">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <polyline points="6 9 12 15 18 9"/>
                            </svg>
                            Seleção
                        </button>
                        <button class="field-btn" data-type="checkbox">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <polyline points="9 11 12 14 22 4"/>
                                <path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/>
                            </svg>
                            Checkbox
                        </button>
                        <button class="field-btn" data-type="radio">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="12" cy="12" r="10"/>
                                <circle cx="12" cy="12" r="3" fill="currentColor"/>
                            </svg>
                            Radio
                        </button>
                        <button class="field-btn" data-type="date">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
                                <line x1="16" y1="2" x2="16" y2="6"/>
                                <line x1="8" y1="2" x2="8" y2="6"/>
                                <line x1="3" y1="10" x2="21" y2="10"/>
                            </svg>
                            Data
                        </button>
                    </div>
                </div>

                <div class="toolbar-section">
                    <h3>Configurações do Formulário</h3>
                    <div class="form-settings">
                        <div class="setting-group">
                            <label>Título do Formulário</label>
                            <input type="text" id="formTitle" placeholder="Meu Formulário">
                        </div>
                        <div class="setting-group">
                            <label>Descrição</label>
                            <textarea id="formDescription" rows="3" placeholder="Descrição do formulário..."></textarea>
                        </div>
                        <div class="setting-group">
                            <label>Texto do Botão</label>
                            <input type="text" id="submitButtonText" value="Enviar">
                        </div>
                        <div class="setting-group">
                            <label>
                                <input type="checkbox" id="showLabels" checked>
                                <span>Mostrar Labels</span>
                            </label>
                        </div>
                        <div class="setting-group">
                            <label>
                                <input type="checkbox" id="requiredFields">
                                <span>Todos os campos obrigatórios</span>
                            </label>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Form Builder -->
            <div class="builder-section">
                <div class="builder-header">
                    <h2>Construtor</h2>
                    <div class="field-count">
                        <span id="fieldCount">0</span> campos
                    </div>
                </div>
                <div id="formBuilder" class="form-builder">
                    <div class="empty-state">
                        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/>
                            <polyline points="14 2 14 8 20 8"/>
                        </svg>
                        <h3>Comece adicionando campos</h3>
                        <p>Clique nos botões à esquerda para adicionar campos ao formulário</p>
                    </div>
                </div>
            </div>

            <!-- Preview -->
            <div class="preview-section">
                <div class="preview-header">
                    <h2>Pré-visualização</h2>
                    <button class="btn btn-small btn-secondary" id="testFormBtn">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polygon points="5 3 19 12 5 21 5 3"/>
                        </svg>
                        Testar
                    </button>
                </div>
                <div class="form-preview" id="formPreview">
                    <div class="preview-form">
                        <h2 id="previewTitle">Meu Formulário</h2>
                        <p id="previewDescription" class="preview-description"></p>
                        <div id="previewFields"></div>
                        <button type="button" class="preview-submit" id="previewSubmit">Enviar</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal for Export -->
    <div class="modal" id="exportModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Código HTML do Formulário</h2>
                <button class="modal-close" id="closeModal">×</button>
            </div>
            <div class="modal-body">
                <textarea id="exportCode" readonly></textarea>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" id="closeModalBtn">Fechar</button>
                <button class="btn btn-primary" id="copyCodeBtn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
                        <path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/>
                    </svg>
                    Copiar Código
                </button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
