<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow Pro - Gerenciador de Tarefas Kanban</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <h1 class="logo">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M9 11l3 3L22 4"/>
                        <path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/>
                    </svg>
                    TaskFlow Pro
                </h1>
                <div class="header-actions">
                    <button class="btn btn-secondary" id="clearAllBtn">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="3 6 5 6 21 6"/>
                            <path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/>
                        </svg>
                        Limpar Tudo
                    </button>
                    <button class="btn btn-primary" id="exportBtn">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
                            <polyline points="7 10 12 15 17 10"/>
                            <line x1="12" y1="15" x2="12" y2="3"/>
                        </svg>
                        Exportar
                    </button>
                </div>
            </div>
        </header>

        <!-- Stats -->
        <div class="stats-container">
            <div class="stat-card">
                <div class="stat-icon todo-color">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"/>
                    </svg>
                </div>
                <div class="stat-info">
                    <div class="stat-label">A Fazer</div>
                    <div class="stat-value" id="todoCount">0</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon progress-color">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 2v20M2 12h20"/>
                    </svg>
                </div>
                <div class="stat-info">
                    <div class="stat-label">Em Progresso</div>
                    <div class="stat-value" id="progressCount">0</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon done-color">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="20 6 9 17 4 12"/>
                    </svg>
                </div>
                <div class="stat-info">
                    <div class="stat-label">Concluído</div>
                    <div class="stat-value" id="doneCount">0</div>
                </div>
            </div>
        </div>

        <!-- Kanban Board -->
        <div class="board-container">
            <!-- Todo Column -->
            <div class="column">
                <div class="column-header todo-color">
                    <h2>A Fazer</h2>
                    <span class="task-count" id="todoColumnCount">0</span>
                </div>
                <div class="add-task-form">
                    <input type="text" id="todoInput" placeholder="Nova tarefa..." class="task-input">
                    <button class="btn-add" id="addTodoBtn">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="12" y1="5" x2="12" y2="19"/>
                            <line x1="5" y1="12" x2="19" y2="12"/>
                        </svg>
                    </button>
                </div>
                <div class="tasks-list" id="todoList" data-column="todo"></div>
            </div>

            <!-- In Progress Column -->
            <div class="column">
                <div class="column-header progress-color">
                    <h2>Em Progresso</h2>
                    <span class="task-count" id="progressColumnCount">0</span>
                </div>
                <div class="add-task-form">
                    <input type="text" id="progressInput" placeholder="Nova tarefa..." class="task-input">
                    <button class="btn-add" id="addProgressBtn">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="12" y1="5" x2="12" y2="19"/>
                            <line x1="5" y1="12" x2="19" y2="12"/>
                        </svg>
                    </button>
                </div>
                <div class="tasks-list" id="progressList" data-column="progress"></div>
            </div>

            <!-- Done Column -->
            <div class="column">
                <div class="column-header done-color">
                    <h2>Concluído</h2>
                    <span class="task-count" id="doneColumnCount">0</span>
                </div>
                <div class="add-task-form">
                    <input type="text" id="doneInput" placeholder="Nova tarefa..." class="task-input">
                    <button class="btn-add" id="addDoneBtn">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="12" y1="5" x2="12" y2="19"/>
                            <line x1="5" y1="12" x2="19" y2="12"/>
                        </svg>
                    </button>
                </div>
                <div class="tasks-list" id="doneList" data-column="done"></div>
            </div>
        </div>

        <!-- Footer -->
        <footer class="footer">
            <p>TaskFlow Pro - Gerenciador de Tarefas Kanban | Todos os dados são salvos localmente no seu navegador</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
