<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinkShrink - Encurtador de URLs Profissional</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <h1 class="logo">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M10 13a5 5 0 007.54.54l3-3a5 5 0 00-7.07-7.07l-1.72 1.71"/>
                        <path d="M14 11a5 5 0 00-7.54-.54l-3 3a5 5 0 007.07 7.07l1.71-1.71"/>
                    </svg>
                    LinkShrink
                </h1>
                <div class="header-stats">
                    <div class="stat">
                        <span class="stat-value" id="totalLinks">0</span>
                        <span class="stat-label">Links</span>
                    </div>
                    <div class="stat">
                        <span class="stat-value" id="totalClicks">0</span>
                        <span class="stat-label">Cliques</span>
                    </div>
                </div>
            </div>
        </header>

        <!-- Main Section -->
        <div class="main-content">
            <!-- URL Shortener Form -->
            <div class="shorten-section">
                <div class="shorten-card">
                    <h2>Encurtar URL</h2>
                    <div class="url-input-group">
                        <div class="input-with-icon">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="12" cy="12" r="10"/>
                                <line x1="2" y1="12" x2="22" y2="12"/>
                                <path d="M12 2a15.3 15.3 0 014 10 15.3 15.3 0 01-4 10 15.3 15.3 0 01-4-10 15.3 15.3 0 014-10z"/>
                            </svg>
                            <input type="url" id="longUrl" placeholder="Cole sua URL longa aqui...">
                        </div>
                        <button class="btn btn-primary" id="shortenBtn">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M22 11.08V12a10 10 0 11-5.93-9.14"/>
                                <polyline points="22 4 12 14.01 9 11.01"/>
                            </svg>
                            Encurtar
                        </button>
                    </div>

                    <div class="custom-options">
                        <div class="option-group">
                            <label>
                                <input type="checkbox" id="customAlias">
                                <span>URL Personalizada</span>
                            </label>
                            <input type="text" id="customAliasInput" placeholder="meu-link" disabled>
                        </div>
                    </div>

                    <!-- Result Section -->
                    <div class="result-section" id="resultSection" style="display: none;">
                        <div class="result-header">
                            <h3>Link Encurtado</h3>
                            <span class="success-badge">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <polyline points="20 6 9 17 4 12"/>
                                </svg>
                                Sucesso
                            </span>
                        </div>
                        <div class="shortened-url">
                            <input type="text" id="shortUrlDisplay" readonly>
                            <button class="btn btn-copy" id="copyBtn" title="Copiar">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
                                    <path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/>
                                </svg>
                            </button>
                        </div>
                        <div class="qr-code-section">
                            <h4>QR Code</h4>
                            <div class="qr-code" id="qrCode"></div>
                            <button class="btn btn-secondary btn-small" id="downloadQrBtn">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
                                    <polyline points="7 10 12 15 17 10"/>
                                    <line x1="12" y1="15" x2="12" y2="3"/>
                                </svg>
                                Baixar QR Code
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Links List -->
            <div class="links-section">
                <div class="links-header">
                    <h2>Seus Links</h2>
                    <div class="links-actions">
                        <button class="btn btn-secondary btn-small" id="clearAllBtn">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <polyline points="3 6 5 6 21 6"/>
                                <path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/>
                            </svg>
                            Limpar Tudo
                        </button>
                        <button class="btn btn-primary btn-small" id="exportBtn">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
                                <polyline points="7 10 12 15 17 10"/>
                                <line x1="12" y1="15" x2="12" y2="3"/>
                            </svg>
                            Exportar
                        </button>
                    </div>
                </div>

                <div class="search-box">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"/>
                        <path d="M21 21l-4.35-4.35"/>
                    </svg>
                    <input type="text" id="searchInput" placeholder="Buscar links...">
                </div>

                <div id="linksList" class="links-list">
                    <div class="empty-state">
                        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <path d="M10 13a5 5 0 007.54.54l3-3a5 5 0 00-7.07-7.07l-1.72 1.71"/>
                            <path d="M14 11a5 5 0 00-7.54-.54l-3 3a5 5 0 007.07 7.07l1.71-1.71"/>
                        </svg>
                        <h3>Nenhum link encurtado ainda</h3>
                        <p>Comece encurtando sua primeira URL acima</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
