<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><title>Expense Splitter - Divisor de Despesas</title><link rel="stylesheet" href="styles.css"></head>
<body><div class="app"><h1>💸 Expense Splitter</h1><div class="split-container"><div class="panel"><h2>Participantes</h2><div class="add-person"><input type="text" id="personName" placeholder="Nome"><button class="btn" id="addPersonBtn">+ Adicionar</button></div><div id="peopleList"></div></div><div class="panel"><h2>Despesas</h2><div class="add-expense"><input type="text" id="expenseName" placeholder="Descrição"><input type="number" id="expenseAmount" placeholder="Valor"><select id="paidBy"></select><button class="btn" id="addExpenseBtn">+ Adicionar</button></div><div id="expensesList"></div></div><div class="panel"><h2>Resumo</h2><div id="summary"></div></div></div></div><script src="script.js"></script></body>
</html>
